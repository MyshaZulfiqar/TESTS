<!DOCTYPE html>
<html>
<head>
  <title>Fetch Data from GAS</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      font-size: 1rem;
    }
    #output {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Check Username in Google Sheet</h1>
  <input type="text" id="username" placeholder="Enter username" />
  <button onclick="checkUser()">Check</button>

  <div id="output"></div>

  <script>
    async function checkUser() {
      const username = document.getElementById('username').value;
      const outputDiv = document.getElementById('output');

      if (!username) {
        outputDiv.innerText = "Please enter a username.";
        return;
      }

      try {
        const response = await fetch(`https://script.google.com/macros/s/AKfycbxLupnUGGF5HK2bK9B6Dsr04kPTDwAwcTzhqiK7Gkl06OWd941jvEBWEK61u8AtyMY/exec=${encodeURIComponent(username)}`);
        const data = await response.json();

        if (data.error) {
          outputDiv.innerText = "❌ " + data.error;
        } else {
          outputDiv.innerText = `Found: ${data.username} → ${data.value}`;
        }
      } catch (err) {
        outputDiv.innerText = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
